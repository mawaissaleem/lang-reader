services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Only download and load English & German models (saves disk space & RAM)
      - LT_LOAD_ONLY=en,de
      # Unlimited requests for local development
      - LT_REQ_LIMIT=0
      # Enable web UI for easy manual testing at http://localhost:5000
      - LT_DISABLE_WEB_UI=False
    volumes:
      # Persist downloaded language models between restarts
      - libretranslate_data:/home/libretranslate/.local

volumes:
  libretranslate_data:

